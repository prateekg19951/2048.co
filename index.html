<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 2048 Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Clear+Sans:wght@400;700&display=swap" rel="stylesheet"> <!-- Free Google Font -->
</head>
<body>
    <div class="container">
        <h1>2048</h1>
        <div class="score-container">
            <div class="score-title">Score</div>
            <span id="score">0</span>
        </div>
        <div class="grid-container">
            <div class="grid" id="grid">
                <!-- 16 empty cells will be generated by JS -->
            </div>
        </div>
        <div class="game-message">
            <p></p>
            <div class="lower">
                <button class="restart-button" onclick="initGame()">New Game</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
